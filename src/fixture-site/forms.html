<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Auditor Fixture — Forms &amp; validation</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="fixed-header">FIXTURE HEADER (fixed)</header>
    <nav aria-label="Primary">
      <ul>
        <li><a href="/">Home</a></li>
      </ul>
    </nav>
    <main>
      <h1>Forms &amp; validation</h1>
      <form id="signup" novalidate>
        <label>
          Email (required, must validate)
          <input type="email" id="email" name="email" required />
        </label>
        <label>
          Password (type=password — must never be collected)
          <input type="password" id="password" name="password" required minlength="8" />
        </label>
        <fieldset>
          <legend>Checkbox group</legend>
          <label><input type="checkbox" name="prefs" value="alpha" /> Alpha</label>
          <label><input type="checkbox" name="prefs" value="beta" /> Beta</label>
        </fieldset>
        <label>
          Region select
          <select id="region" name="region">
            <option value="">-- choose --</option>
            <option value="eu">EU</option>
            <option value="na">NA</option>
          </select>
        </label>
        <label>
          Message textarea
          <textarea id="message" name="message"></textarea>
        </label>
        <button type="submit" id="signup-submit">Sign up</button>
        <button type="reset" id="signup-reset">Reset</button>
        <p id="validation-errors" role="alert" aria-live="assertive"></p>
      </form>
    </main>
    <footer class="sticky-footer">FIXTURE FOOTER (sticky)</footer>
    <script src="/forms.js"></script>
  </body>
</html>
