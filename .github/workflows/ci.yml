name: CI

# Continuous integration: lint, formatting, type check, unit/component tests.
# E2E tests run in e2e.yml (needs a built extension + browser); production
# validation runs in build.yml — intentionally not duplicated here.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege by default.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality-and-tests:
    name: Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # Reads the pinned version from package.json "packageManager".

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Validate formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Unit and component tests
        run: pnpm test
