name: Dependency Review

# Summarizes vulnerable/invalid dependency changes on PRs and fails the check
# for vulnerabilities at or above HIGH severity (decided 2026-10-31; ordinary
# scoped updates keep flowing — see docs/CI_CD.md for the rationale).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # The action detects the pnpm lockfile automatically.
          comment-summary-in-pr: on-failure
          deny-licenses: AGPL-3.0, AGPL-3.0-or-later
