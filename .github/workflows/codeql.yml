name: CodeQL

# Static security analysis for JavaScript/TypeScript, including the
# extension's service worker, content scripts, panel, and CI scripts.
# Results land in the repo's Security → Code Scanning view.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly, Monday 05:33 UTC (off-the-hour minute avoids runner congestion).
    - cron: '33 5 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: javascript-typescript
          queries: security-extended

      # CodeQL autodiscover scans all JS/TS sources; no build step is required.

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          category: '/language:javascript-typescript'
