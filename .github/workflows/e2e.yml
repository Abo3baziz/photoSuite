name: E2E

# Chrome extension end-to-end tests: builds the extension, loads the unpacked
# build into Chromium, serves the local fixture site, and runs Playwright E2E.
# Scope grows with the product milestones: currently install/panel/settings
# flows; discovery/interaction/persistence tests land with milestones 2+ and
# are intentionally NOT asserted until the features exist.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  chrome-extension-tests:
    name: Chrome Extension Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium (with system dependencies)
        run: pnpm exec playwright install --with-deps chromium

      - name: Build production extension
        run: pnpm build

      - name: Validate production build
        run: pnpm build:validate

      - name: Run E2E tests
        run: pnpm e2e
        env:
          CI: 'true'

      - name: Upload Playwright report and failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
